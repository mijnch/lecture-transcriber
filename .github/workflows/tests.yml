name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    # 이 도구는 Windows 전용이므로 실제 대상 플랫폼·버전에서 검증한다.
    runs-on: windows-latest

    # pwsh(PowerShell 7)는 스크립트를 UTF-8로 읽는다. Windows PowerShell 5.1이나
    # cmd 는 한글이 든 파일 이름을 깨뜨리므로 여기서는 쓰지 않는다.
    defaults:
      run:
        shell: pwsh

    env:
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 잠긴 의존성이 이 플랫폼에서 설치 가능한지
        # 메타데이터만 받아 풀어 본다 — 휠이 없거나 버전이 빠졌으면 여기서 실패한다.
        # ':all: ' 의 콜론+공백을 YAML 이 키로 읽으므로 블록 문자열로 쓴다.
        run: |
          python -m pip install --dry-run --ignore-installed --only-binary=:all: -r engine/requirements.txt

      - name: 단위 검증 87개
        # 모델·ffmpeg·Tesseract 없이, 몇 시간짜리 전사 없이 문단화·빠진 말소리 찾기·
        # 화면 전환 검출·OCR 판정·PDF 정합·자막 구분·산출물 형식을 확인한다.
        # 전환 검출만 numpy 가 필요하다.
        run: |
          python -m pip install --quiet numpy==2.4.6
          python "engine/문단화_검증.py"

      - name: 엔진 구문 검사
        run: python -m compileall -q engine
