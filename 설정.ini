; Transcriber 설정 파일
; 값을 바꾼 뒤 저장하고 "Transcriber 실행.bat"을 실행하면,
; 설정이 바뀐 파일은 자동으로 다시 변환됩니다.

[settings]
; 슬라이드 읽기: 켬 / 끔  (다른 말은 인식하지 않습니다)
;   켬 - 화면이 바뀔 때마다 슬라이드의 글자를 읽어 전사문에 함께 싣습니다.
;        말로만 남던 "여기 보시면" 같은 대목의 내용이 채워집니다.
;   이 값을 바꾸면 음성 전사까지 전부 다시 합니다.
슬라이드_읽기 = 켬

; 슬라이드 글자의 언어: 자동 / kor / eng  (언어 코드로 적어야 합니다. "한국어"는 안 됩니다)
;   자동 - 권장. 한국어와 영어로 각각 읽어 본 뒤 줄마다 잘 읽힌 쪽을 고릅니다.
;          kor+eng 처럼 섞으면 굵은 한글이 영어로 오인되므로(질문을→HAS) 섞지 않습니다.
슬라이드_언어 = 자동

; 모델: large-v3-turbo(권장) / medium / small / base
;   small 은 빠르지만 한국어 정확도가 크게 떨어집니다. 영어 전용일 때만 권합니다
model = large-v3-turbo

; 언어: auto(자동 감지) / ko / en / ja / zh ...
;   auto 는 앞부분 30초로 파일의 주 언어를 정합니다. 강의가 다른 언어로 시작하면
;   틀릴 수 있으니, 주로 쓰는 언어가 분명하면 ko 나 en 으로 고정하세요.
;   어느 쪽이든 주 언어가 아닌 말로 한 대목은 빠진 곳을 찾아 다시 읽습니다.
language = auto

; 빔 크기: 1 = 가장 빠름(기본), 3~5 = 조금 더 정확하지만 느립니다
beam_size = 1
